application:
  name: strapi-cms
  pods:
  - name: app
    image: "# filled by pipeline"
    path: /
    servicePorts:
    - 1337
    vars:
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres.pod
      DATABASE_PORT: "5432"
      DATABASE_NAME: strapi
      DATABASE_USERNAME: strapi
      DATABASE_PASSWORD: strapi
      JWT_SECRET: "a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4"
      APP_KEYS: "tobemodified1,tobemodified2,tobemodified3,tobemodified4"
      API_TOKEN_SALT: "a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4"
      ADMIN_JWT_SECRET: "a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4"
      NODE_ENV: production
    volumes:
    - name: strapi-cms-app
      mountPath: /srv/app
      size: 5Gi
    - name: strapi-cms-uploads
      mountPath: /app/public/uploads
      size: 5Gi
  - name: postgres
    image: postgres:16
    servicePorts:
    - 5432
    vars:
      POSTGRES_DB: strapi
      POSTGRES_USER: strapi
      POSTGRES_PASSWORD: strapi
    volumes:
    - name: strapi-cms-db
      mountPath: /var/lib/postgresql
      size: 5Gi
